name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kivy buildozer

      - name: Build APK
        run: |
          buildozer init
          sed -i 's/title = My Application/title = TodoApp/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = todoapp/' buildozer.spec
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TodoApp-APK
          path: bin/*.apk

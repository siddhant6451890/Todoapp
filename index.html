<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My To-Do App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>MY TO-DO APP</h1>

    <div id="counter">
      Total: 0 | Done: 0
    </div>


    <!-- SEARCH -->

    <input
      type="text"
      id="searchInput"
      placeholder="Search tasks..."
    >


    <!-- ADD TASK -->

    <div class="add-task">

      <input
        type="text"
        id="taskInput"
        placeholder="Enter new task..."
      >


      <!-- PHOTO BUTTON -->

      <button
        type="button"
        onclick="addPhoto()"
      >
        📷 PHOTO
      </button>


      <!-- HIDDEN PHOTO INPUT -->

      <input
        type="file"
        id="photoInput"
        accept="image/*"
        onchange="handlePhoto(event)"
        style="display: none;"
      >


      <!-- ADD TASK BUTTON -->

      <button
        type="button"
        onclick="addTask()"
      >
        ADD TASK
      </button>

    </div>


    <!-- FILTER BUTTONS -->

    <div class="filters">

      <button
        type="button"
        onclick="setFilter('ALL')"
      >
        ALL
      </button>


      <button
        type="button"
        onclick="setFilter('ACTIVE')"
      >
        ACTIVE
      </button>


      <button
        type="button"
        onclick="setFilter('DONE')"
      >
        DONE
      </button>

    </div>


    <!-- TASK LIST -->

    <div id="taskList"></div>

  </div>


  <!-- JAVASCRIPT -->

  <script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My To-Do App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>MY TO-DO APP</h1>

      <div id="clock">00:00:00</div>
      <div id="date">Loading date...</div>
    </div>


    <div id="counter">
      Total: 0 | Done: 0
    </div>


    <!-- SEARCH -->

    <input
      type="text"
      id="searchInput"
      placeholder="🔍 Search tasks..."
    >


    <!-- ADD TASK -->

    <div class="add-task">

      <input
        type="text"
        id="taskInput"
        placeholder="Enter new task..."
      >

      <button
        type="button"
        onclick="addTask()"
      >
        ADD TASK
      </button>

    </div>


    <!-- FILTERS -->

    <div class="filters">

      <button
        type="button"
        onclick="setFilter('ALL')"
      >
        ALL
      </button>

      <button
        type="button"
        onclick="setFilter('ACTIVE')"
      >
        ACTIVE
      </button>

      <button
        type="button"
        onclick="setFilter('DONE')"
      >
        DONE
      </button>

    </div>


    <!-- TASK LIST -->

    <div id="taskList"></div>

  </div>


  <script src="script.js"></script>

</body>
</html>
